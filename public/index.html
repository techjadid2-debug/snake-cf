<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BLOK — Tetris</title>
<style>
  :root{
    --bg:#0d1320;
    --panel:#141d30;
    --grid:#1b2640;
    --line:#243152;
    --ink:#e8edf7;
    --muted:#7d8bab;
    --accent:#5ee0c8;
    --I:#3fc6e0; --O:#e6c84d; --T:#a874e8; --S:#5fcf6e; --Z:#e0606a; --J:#5a8de0; --L:#e0944a;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(circle at 50% -10%,#16213a 0%,var(--bg) 60%);
    color:var(--ink);
    font-family:var(--mono);
    display:flex;align-items:center;justify-content:center;
    min-height:100dvh;padding:16px;
    -webkit-tap-highlight-color:transparent;overflow:hidden;
  }
  .app{
    display:flex;gap:22px;align-items:flex-start;
    background:rgba(20,29,48,.55);
    border:1px solid var(--line);
    border-radius:18px;padding:22px;
    box-shadow:0 30px 80px -30px #000, inset 0 1px 0 #ffffff0d;
    backdrop-filter:blur(6px);
  }
  .title{
    font-size:13px;letter-spacing:.42em;color:var(--accent);
    text-transform:uppercase;margin-bottom:14px;font-weight:700;
  }
  .title b{color:var(--muted);font-weight:400}
  canvas{display:block;border-radius:10px;background:var(--panel);
    box-shadow:inset 0 0 0 1px var(--line), inset 0 0 60px #0008;}
  .side{display:flex;flex-direction:column;gap:14px;width:148px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .box h3{font-size:10px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;margin-bottom:9px;font-weight:600}
  .stat{font-size:26px;line-height:1.1;font-weight:700;color:var(--ink)}
  .stat.small{font-size:18px}
  .mini{display:flex;flex-direction:column;gap:8px;align-items:center}
  .help{font-size:10.5px;line-height:1.85;color:var(--muted)}
  .help kbd{display:inline-block;min-width:20px;text-align:center;
    background:var(--grid);border:1px solid var(--line);border-bottom-width:2px;
    border-radius:5px;padding:1px 5px;color:var(--ink);font-size:10px}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;border-radius:10px;
    background:rgba(8,12,22,.86);backdrop-filter:blur(3px);text-align:center;padding:20px}
  .overlay h2{font-size:22px;letter-spacing:.1em}
  .overlay p{color:var(--muted);font-size:12px;line-height:1.7}
  .btn{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    background:var(--accent);color:#07211c;border:none;border-radius:9px;
    padding:11px 22px;font-weight:700;cursor:pointer;transition:transform .08s,filter .15s}
  .btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
  .board-wrap{position:relative}
  .touch{display:none;gap:10px;margin-top:14px;width:100%}
  .touch button{flex:1;font-family:var(--mono);font-size:18px;background:var(--grid);
    color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px 0;cursor:pointer}
  .touch button:active{background:var(--line)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:560px){
    .app{flex-direction:column;align-items:center;gap:14px;padding:14px}
    .side{flex-direction:row;flex-wrap:wrap;width:auto;justify-content:center}
    .box{flex:1;min-width:96px}
    .help{display:none}
    .touch{display:flex}
  }
</style>
</head>
<body>
<div class="app">
  <div>
    <div class="title">BLOK <b>// tetris</b></div>
    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">BLOK</h2>
        <p id="ovText">O'q tugmalari bilan boshqar.<br>Boshlash uchun bos.</p>
        <button class="btn" id="startBtn">Boshlash</button>
      </div>
    </div>
    <div class="touch" id="touch">
      <button data-act="left">◀</button>
      <button data-act="rotate">⟳</button>
      <button data-act="down">▼</button>
      <button data-act="drop">⤓</button>
      <button data-act="right">▶</button>
    </div>
  </div>

  <div class="side">
    <div class="box"><h3>Keyingi</h3><canvas id="next" class="mini"></canvas></div>
    <div class="box"><h3>Saqlash</h3><canvas id="hold" class="mini"></canvas></div>
    <div class="box"><h3>Hisob</h3><div class="stat" id="score">0</div></div>
    <div class="box" style="display:flex;gap:14px">
      <div><h3>Daraja</h3><div class="stat small" id="level">1</div></div>
      <div><h3>Qator</h3><div class="stat small" id="lines">0</div></div>
    </div>
    <div class="box help">
      <kbd>←</kbd><kbd>→</kbd> harakat<br>
      <kbd>↑</kbd> aylantirish<br>
      <kbd>↓</kbd> tez tushirish<br>
      <kbd>Space</kbd> hard drop<br>
      <kbd>C</kbd> saqlash (hold)<br>
      <kbd>P</kbd> pauza
    </div>
  </div>
</div>

<script>
(() => {
  // ---- Konfiguratsiya ----
  const COLS = 10, ROWS = 20, HIDDEN = 2; // 2 yashirin qator (spawn)
  const TOTAL = ROWS + HIDDEN;
  const CELL = 30;                          // bitta katak px (mantiqiy)
  const COLORS = {I:'--I',O:'--O',T:'--T',S:'--S',Z:'--Z',J:'--J',L:'--L'};
  const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();

  // Tetromino'lar — har biri 4 ta rotation holatida [x,y] koordinatalari
  const SHAPES = {
    I:[[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]],[[0,2],[1,2],[2,2],[3,2]],[[1,0],[1,1],[1,2],[1,3]]],
    O:[[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]]],
    T:[[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]],
    S:[[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]],[[1,1],[2,1],[0,2],[1,2]],[[0,0],[0,1],[1,1],[1,2]]],
    Z:[[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[1,2],[2,2]],[[1,0],[0,1],[1,1],[0,2]]],
    J:[[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]],
    L:[[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]]
  };
  // SRS wall-kick jadvallari
  const KICKS = {
    JLSTZ:{'0>1':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],'1>0':[[0,0],[1,0],[1,-1],[0,2],[1,2]],
           '1>2':[[0,0],[1,0],[1,-1],[0,2],[1,2]],'2>1':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
           '2>3':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],'3>2':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
           '3>0':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],'0>3':[[0,0],[1,0],[1,1],[0,-2],[1,-2]]},
    I:{'0>1':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],'1>0':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],
       '1>2':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]],'2>1':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],
       '2>3':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],'3>2':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],
       '3>0':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],'0>3':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]]}
  };

  // ---- Canvas tayyorlash (Retina/HiDPI) ----
  const board = document.getElementById('board');
  const bctx = board.getContext('2d');
  const nextC = document.getElementById('next'), nctx = nextC.getContext('2d');
  const holdC = document.getElementById('hold'), hctx = holdC.getContext('2d');
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  function setup(c, w, h){ c.width=w*dpr; c.height=h*dpr; c.style.width=w+'px'; c.style.height=h+'px';
    c.getContext('2d').setTransform(dpr,0,0,dpr,0,0); }
  setup(board, COLS*CELL, ROWS*CELL);
  setup(nextC, 120, 76);
  setup(holdC, 120, 76);

  // ---- O'yin holati ----
  let grid, cur, queue, bag, holdPiece, canHold, score, lines, level;
  let dropTimer=0, lockTimer=0, lockReset=0, running=false, paused=false, over=false, last=0;
  let clearing=null;

  const newGrid = () => Array.from({length:TOTAL},()=>Array(COLS).fill(null));

  function refillBag(){
    const t=['I','O','T','S','Z','J','L'];
    for(let i=t.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[t[i],t[j]]=[t[j],t[i]];}
    bag.push(...t);
  }
  function nextType(){ if(bag.length<7) refillBag(); return bag.shift(); }

  function spawn(type){
    const t = type || queue.shift();
    if(!type) queue.push(nextType());
    const piece = {type:t, rot:0, x:3, y:0};
    if(t==='I'||t==='O') piece.x=3;
    if(collides(piece)){ gameOver(); return null; }
    return piece;
  }

  function cells(p){ return SHAPES[p.type][p.rot].map(([x,y])=>[p.x+x, p.y+y]); }
  function collides(p){
    return cells(p).some(([x,y]) => x<0||x>=COLS||y>=TOTAL||(y>=0&&grid[y][x]));
  }

  function rotate(dir){
    const from=cur.rot, to=(cur.rot+(dir>0?1:3))%4;
    const test={...cur, rot:to};
    const table = cur.type==='I'?KICKS.I:(cur.type==='O'?null:KICKS.JLSTZ);
    if(!table){ if(!collides(test)){cur=test; resetLock();} return; }
    const kicks = table[`${from}>${to}`]||[[0,0]];
    for(const [kx,ky] of kicks){
      const t={...test, x:test.x+kx, y:test.y-ky}; // y: ekranda pastga + bo'lgani uchun teskari
      if(!collides(t)){ cur=t; resetLock(); return; }
    }
  }
  function move(dx,dy){
    const t={...cur, x:cur.x+dx, y:cur.y+dy};
    if(!collides(t)){ cur=t; if(dx) resetLock(); return true; }
    return false;
  }
  function resetLock(){ if(lockReset<15 && onGround()){ lockTimer=0; lockReset++; } }
  function onGround(){ return collides({...cur, y:cur.y+1}); }

  function ghostY(){
    let g={...cur}; while(!collides({...g, y:g.y+1})) g.y++; return g.y;
  }

  function hardDrop(){
    let dist=0; while(move(0,1)) dist++;
    score += dist*2; lockPiece();
  }

  function lockPiece(){
    cells(cur).forEach(([x,y])=>{ if(y>=0) grid[y][x]=cur.type; });
    canHold=true; lockReset=0;
    const full=[];
    for(let y=0;y<TOTAL;y++) if(grid[y].every(c=>c)) full.push(y);
    if(full.length){ clearing={rows:full, t:0}; }
    else { cur=spawn(); }
    dropTimer=0; lockTimer=0;
  }

  function applyClear(rows){
    rows.sort((a,b)=>a-b).forEach(y=>{ grid.splice(y,1); grid.unshift(Array(COLS).fill(null)); });
    const n=rows.length;
    score += [0,100,300,500,800][n]*level;
    lines += n;
    const nl = Math.floor(lines/10)+1;
    if(nl>level){ level=nl; }
    cur=spawn();
  }

  function hold(){
    if(!canHold) return;
    canHold=false;
    if(holdPiece){ const h=holdPiece; holdPiece=cur.type; cur=spawn(h); }
    else { holdPiece=cur.type; cur=spawn(); }
  }

  function gravity(){ return Math.max(40, (0.8 - (level-1)*0.07)**(level-1) *1000) || 40; }
  // soddalashtirilgan, ishonchli formula:
  function gravityMs(){
    const speeds=[1000,793,618,473,355,262,190,135,94,64,43,28,18,11,7];
    return speeds[Math.min(level-1, speeds.length-1)];
  }

  // ---- Render ----
  function drawCell(ctx, x, y, type, ghost){
    const c = css(COLORS[type]);
    if(ghost){
      ctx.fillStyle = c+'2e';
      ctx.fillRect(x*CELL+1, y*CELL+1, CELL-2, CELL-2);
      ctx.strokeStyle = c+'88'; ctx.lineWidth=1.5;
      ctx.strokeRect(x*CELL+2, y*CELL+2, CELL-4, CELL-4);
      return;
    }
    ctx.fillStyle = c;
    ctx.fillRect(x*CELL+1, y*CELL+1, CELL-2, CELL-2);
    ctx.fillStyle = '#ffffff26';
    ctx.fillRect(x*CELL+1, y*CELL+1, CELL-2, (CELL-2)*0.34); // tepa yorug'lik
    ctx.fillStyle = '#0000002e';
    ctx.fillRect(x*CELL+1, y*CELL+(CELL*0.66), CELL-2, (CELL-2)*0.34); // pastki soya
  }

  function render(){
    bctx.clearRect(0,0,COLS*CELL,ROWS*CELL);
    // panjara
    bctx.strokeStyle = css('--grid'); bctx.lineWidth=1;
    for(let x=1;x<COLS;x++){ bctx.beginPath();bctx.moveTo(x*CELL,0);bctx.lineTo(x*CELL,ROWS*CELL);bctx.stroke(); }
    for(let y=1;y<ROWS;y++){ bctx.beginPath();bctx.moveTo(0,y*CELL);bctx.lineTo(COLS*CELL,y*CELL);bctx.stroke(); }

    // qotgan bloklar (yashirin qatorlarni hisobga olib)
    for(let y=HIDDEN;y<TOTAL;y++) for(let x=0;x<COLS;x++)
      if(grid[y][x]) drawCell(bctx, x, y-HIDDEN, grid[y][x]);

    // line-clear flash
    if(clearing){
      const a = 1 - clearing.t/180;
      bctx.fillStyle = `rgba(255,255,255,${0.85*a})`;
      clearing.rows.forEach(y=> bctx.fillRect(0,(y-HIDDEN)*CELL, COLS*CELL, CELL));
    }

    if(cur && !clearing){
      // ghost
      const gy=ghostY();
      SHAPES[cur.type][cur.rot].forEach(([dx,dy])=>{
        const yy=gy+dy-HIDDEN; if(yy>=0) drawCell(bctx, cur.x+dx, yy, cur.type, true);
      });
      // joriy
      cells(cur).forEach(([x,y])=>{ if(y-HIDDEN>=0) drawCell(bctx, x, y-HIDDEN, cur.type); });
    }
  }

  function drawPreview(ctx, type){
    ctx.clearRect(0,0,120,76);
    if(!type) return;
    const sh=SHAPES[type][0];
    const xs=sh.map(s=>s[0]), ys=sh.map(s=>s[1]);
    const w=Math.max(...xs)-Math.min(...xs)+1, h=Math.max(...ys)-Math.min(...ys)+1;
    const cs=18, ox=(120-w*cs)/2-Math.min(...xs)*cs, oy=(76-h*cs)/2-Math.min(...ys)*cs;
    const col=css(COLORS[type]);
    sh.forEach(([x,y])=>{
      ctx.fillStyle=col; ctx.fillRect(ox+x*cs+1, oy+y*cs+1, cs-2, cs-2);
      ctx.fillStyle='#ffffff22'; ctx.fillRect(ox+x*cs+1, oy+y*cs+1, cs-2,(cs-2)*0.34);
    });
  }

  function syncHUD(){
    document.getElementById('score').textContent=score.toLocaleString();
    document.getElementById('level').textContent=level;
    document.getElementById('lines').textContent=lines;
    drawPreview(nctx, queue[0]);
    drawPreview(hctx, holdPiece);
  }

  // ---- Asosiy sikl ----
  function loop(ts){
    if(!running){ return; }
    const dt = ts-last; last=ts;
    if(!paused){
      if(clearing){
        clearing.t += dt;
        if(clearing.t>=180){ const r=clearing.rows; clearing=null; applyClear(r); syncHUD(); }
      } else if(cur){
        dropTimer += dt;
        if(dropTimer >= gravityMs()){ dropTimer=0; if(!move(0,1)){ /* tepada turibdi */ } }
        if(onGround()){ lockTimer+=dt; if(lockTimer>=500) lockPiece(); }
        else lockTimer=0;
      }
      render();
    }
    requestAnimationFrame(loop);
  }

  // ---- Boshqaruv ----
  const KEY={};
  document.addEventListener('keydown', e=>{
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    if(!running||over) { if(e.key==='Enter') start(); return; }
    if(e.key==='p'||e.key==='P'){ togglePause(); return; }
    if(paused) return;
    if(clearing) return;
    switch(e.key){
      case 'ArrowLeft': move(-1,0); break;
      case 'ArrowRight': move(1,0); break;
      case 'ArrowDown': if(move(0,1)){ score+=1; dropTimer=0; } break;
      case 'ArrowUp': case 'x': case 'X': rotate(1); break;
      case 'z': case 'Z': rotate(-1); break;
      case ' ': hardDrop(); break;
      case 'c': case 'C': hold(); break;
    }
    render(); syncHUD();
  });

  // mobil tugmalar
  let repeat=null;
  document.getElementById('touch').addEventListener('pointerdown', e=>{
    const act=e.target.dataset.act; if(!act||!running||paused||over||clearing) return;
    const fn={left:()=>move(-1,0),right:()=>move(1,0),down:()=>{if(move(0,1)){score+=1;dropTimer=0;}},
              rotate:()=>rotate(1),drop:()=>hardDrop()}[act];
    fn(); render(); syncHUD();
    if(act==='left'||act==='right'||act==='down'){ repeat=setInterval(()=>{fn();render();syncHUD();},90); }
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>
    document.getElementById('touch').addEventListener(ev,()=>{clearInterval(repeat);repeat=null;}));

  // ---- O'yin oqimi ----
  const overlay=document.getElementById('overlay');
  function showOverlay(title,text,btn){
    document.getElementById('ovTitle').textContent=title;
    document.getElementById('ovText').innerHTML=text;
    document.getElementById('startBtn').textContent=btn;
    overlay.style.display='flex';
  }
  function start(){
    grid=newGrid(); bag=[]; queue=[]; refillBag();
    for(let i=0;i<4;i++) queue.push(nextType());
    holdPiece=null; canHold=true; score=0; lines=0; level=1;
    dropTimer=0; lockTimer=0; lockReset=0; clearing=null;
    over=false; paused=false; running=true;
    cur=spawn();
    overlay.style.display='none';
    syncHUD(); last=performance.now();
    requestAnimationFrame(loop);
  }
  function togglePause(){
    if(over) return;
    paused=!paused;
    if(paused) showOverlay('Pauza','Davom etish uchun <kbd>P</kbd> yoki tugma.','Davom etish');
    else { overlay.style.display='none'; last=performance.now(); }
  }
  function gameOver(){
    over=true; running=false;
    showOverlay('O\'yin tugadi','Hisob: <b style="color:var(--accent)">'+score.toLocaleString()+
      '</b><br>Qator: '+lines+' · Daraja: '+level,'Qaytadan');
  }
  document.getElementById('startBtn').addEventListener('click', ()=>{
    if(paused){ togglePause(); } else start();
  });

  showOverlay('BLOK','O\'q tugmalari bilan boshqar · <kbd>Space</kbd> hard drop · <kbd>C</kbd> hold','Boshlash');
})();
</script>
</body>
</html>
